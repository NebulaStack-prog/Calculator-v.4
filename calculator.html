<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Калькулятор</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator {
            background: #34495e;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .display {
            background: #1a1a2e;
            color: #00ff88;
            font-size: 2em;
            padding: 20px;
            text-align: right;
            border-radius: 10px;
            margin-bottom: 20px;
            min-height: 60px;
            word-wrap: break-word;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            background: #2c3e50;
            color: white;
            border: 1px solid #4a6a7f;
            padding: 20px;
            font-size: 1.5em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            background: #4a6a7f;
            transform: scale(1.05);
        }
        button.operator {
            background: #e67e22;
        }
        button.operator:hover {
            background: #f39c12;
        }
        button.equals {
            background: #27ae60;
            grid-column: span 2;
        }
        button.equals:hover {
            background: #2ecc71;
        }
        button.clear {
            background: #c0392b;
        }
        button.clear:hover {
            background: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="appendChar('(')">(</button>
            <button onclick="appendChar(')')">)</button>
            <button class="operator" onclick="appendChar('/')">÷</button>
            <button onclick="appendChar('7')">7</button>
            <button onclick="appendChar('8')">8</button>
            <button onclick="appendChar('9')">9</button>
            <button class="operator" onclick="appendChar('*')">×</button>
            <button onclick="appendChar('4')">4</button>
            <button onclick="appendChar('5')">5</button>
            <button onclick="appendChar('6')">6</button>
            <button class="operator" onclick="appendChar('-')">−</button>
            <button onclick="appendChar('1')">1</button>
            <button onclick="appendChar('2')">2</button>
            <button onclick="appendChar('3')">3</button>
            <button class="operator" onclick="appendChar('+')">+</button>
            <button onclick="appendChar('0')">0</button>
            <button onclick="appendChar('.')">.</button>
            <button class="equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let display = document.getElementById('display');
        let expression = '';

        function appendChar(char) {
            expression += char;
            display.textContent = expression;
        }

        function clearDisplay() {
            expression = '';
            display.textContent = '0';
        }

        function calculate() {
            try {
                let result = eval(expression);
                display.textContent = result;
                expression = String(result);
            } catch(e) {
                display.textContent = 'Ошибка!';
                expression = '';
            }
        }

        document.addEventListener('keydown', function(e) {
            const key = e.key;
            if (key >= '0' && key <= '9') appendChar(key);
            else if (key === '+') appendChar('+');
            else if (key === '-') appendChar('-');
            else if (key === '*') appendChar('*');
            else if (key === '/') appendChar('/');
            else if (key === '.') appendChar('.');
            else if (key === 'Enter') calculate();
            else if (key === 'Escape') clearDisplay();
            else if (key === '(') appendChar('(');
            else if (key === ')') appendChar(')');
        });
    </script>
</body>
</html>
